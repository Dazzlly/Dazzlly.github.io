services:
  web:
    image: ruby:3.3
    working_dir: /app
    volumes:
      - .:/app
      - gems:/usr/local/bundle
    ports:
      - "3000:3000"
    command: >
      bash -lc "bundle check || bundle install &&
      bundle exec jekyll serve --host 0.0.0.0 --port 3000 --force_polling --livereload-port 35729"

volumes:
  gems:
